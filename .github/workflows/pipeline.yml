name: Java Selenium CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:
    inputs:
      runner:
        description: "Select the host runner"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

      testGroup:
        description: "Select the test group to execute"
        required: true
        default: "Web"
        type: choice
        options:
          - Unit
          - Sanity
          - Web
          - Api
          - WebApi

      browser:
        description: "Browser type"
        required: true
        default: "chrome"
        type: choice
        options:
          - edge
          - chrome
          - firefox

      headless:
        description: "Run tests in headless mode"
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  Build_Java_Framework:

    permissions:
      contents: write

    runs-on: ${{github.event.inputs.runner || 'ubuntu-latest'}}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Run Tests
        run: mvn test -Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true
          -Dgroups="${{ github.event.inputs.testGroup || 'Web'}}"
          -Dbrowser="${{ github.event.inputs.browser || 'chrome'}}"
          -Dheadless="${{ github.event.inputs.headless || 'true'}}"

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4.6.0
        with:
          name: Test-Reports
          path: ${{ github.workspace }}/target
